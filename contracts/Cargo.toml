[workspace]
members = [
    "borrower_reputation",
    "escrow",
    "lending",
    "default_management",
    "liquidation_auction",
    "governance",
    "multisig_admin",
    "auto_compound_vault",
    "treasury",
    "tlend_token",
    "tlend_vesting",
    "tlend_airdrop",
    "pooled_lending",
    "borrower_loyalty",
    "zk_credit_verifier",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "27.0.5"

# ─── Release profile (optimise WASM size) ────────────────────────────────────
[profile.release]
opt-level     = "z"
overflow-checks = true
debug         = 0
strip         = "symbols"
debug-assertions = false
panic         = "abort"
codegen-units = 1
lto           = true

# Same as release but keeps debug-assertions for log! events on testnet
[profile.release-with-logs]
inherits         = "release"
debug-assertions = true
