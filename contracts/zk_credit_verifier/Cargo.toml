[package]
name    = "zk-credit-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Already in the dependency tree via soroban-sdk's testutils; used by the
# tests to sign proofs as a provider would.
ed25519-dalek = "3"
